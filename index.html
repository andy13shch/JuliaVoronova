<style>

/* ============================================================================
   AvdeevART WRITER EDITION × ПАЛИТРА «ТЁМНЫЙ ТИЛ, ТЁПЛАЯ ТЕРРАКОТА & МОРСКАЯ ВОЛНА»
   + 3D БАРХАТНЫЕ РАЗДВИГАЮЩИЕСЯ КУЛИСЫ ПРИ СКРОЛЛЕ
   ============================================================================ */
:root {
  --c-teal-deep: #003135;
  --c-teal-dark: #024950;
  --c-terracotta: #964734;
  --c-cyan: #0fa4af;
  --c-ice: #afdde5;

  --background: #f6fafb;
  --surface: #ffffff;
  --foreground: #003135;
  --muted: #eaf5f7;
  --muted-foreground: #3b6166;
  --border: #d5e7ea;
  --primary: #024950;
  --primary-foreground: #ffffff;

  --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; max-width: 100%; overflow-x: hidden; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
  max-width: 100%;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; background: none; border: 0; }

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
}

.icon-svg {
  width: 1.15em;
  height: 1.15em;
  display: inline-block;
  vertical-align: -0.2em;
  stroke-width: 1.8;
  flex-shrink: 0;
}

/* ============================================================================
   NAVBAR (AvdeevART adaptive transparent -> frosted paper-teal)
   ============================================================================ */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 60;
  transition: background-color 0.3s ease, padding 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease;
  padding: 16px 0;
  border-bottom: 1px solid transparent;
}
.navbar.is-solid {
  background: rgba(246, 250, 251, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom-color: var(--border);
  padding: 8px 0;
}
.navbar-inner {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-brand {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.04em;
  color: #f4f8f9;
  transition: color 0.3s ease;
}
.nav-brand span { color: var(--c-ice); font-weight: 400; opacity: 0.8; }
.navbar.is-solid .nav-brand { color: var(--c-teal-deep); }
.navbar.is-solid .nav-brand span { color: var(--c-terracotta); opacity: 0.9; }

.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
}
.nav-link {
  font-size: 14px;
  font-weight: 500;
  color: rgba(175, 221, 229, 0.88);
  padding: 6px 0;
  border-bottom: 2px solid transparent;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.nav-link:hover, .nav-link.active { color: #ffffff; }
.nav-link.active { border-bottom-color: #df7b64; }

.navbar.is-solid .nav-link { color: var(--muted-foreground); }
.navbar.is-solid .nav-link:hover, .navbar.is-solid .nav-link.active { color: var(--c-teal-deep); }
.navbar.is-solid .nav-link.active { border-bottom-color: var(--c-terracotta); }

.nav-mobile-btn {
  display: none;
  color: #f4f8f9;
  padding: 6px;
}
.navbar.is-solid .nav-mobile-btn { color: var(--c-teal-deep); }

.nav-mobile-drawer {
  display: none;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  padding: 24px;
}
.nav-mobile-drawer.is-open { display: flex; flex-direction: column; gap: 20px; }
.nav-mobile-drawer a {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 600;
  color: var(--c-teal-deep);
}

/* ============================================================================
   HERO: 3D БАРХАТНЫЕ КУЛИСЫ В ТЁМНОМ ТИЛЕ, РАЗДВИГАЮЩИЕСЯ ПРИ СКРОЛЛЕ
   ============================================================================ */
.hero-scroll-spacer {
  height: 82vh;
  width: 100%;
  pointer-events: none;
}
.hero-drape-stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  z-index: 40;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  pointer-events: none;
  will-change: opacity;
}
.hero-stage-backdrop {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 55% 65% at 50% 42%, rgba(2, 73, 80, 0.28) 0%, rgba(0, 20, 22, 0.94) 70%, #001012 100%);
  z-index: 1;
  pointer-events: none;
  will-change: opacity;
}
.hero-spotlight {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 42% 55% at 50% 38%, rgba(175, 221, 229, 0.16) 0%, rgba(15, 164, 175, 0.06) 45%, transparent 75%),
    conic-gradient(from 162deg at 50% -12%, transparent 0deg, rgba(175, 221, 229, 0.11) 18deg, rgba(223, 123, 100, 0.06) 24deg, transparent 36deg);
  z-index: 6;
  pointer-events: none;
  mix-blend-mode: screen;
  will-change: opacity, transform;
}
.hero-drape-canvas {
  position: absolute;
  inset: -20px;
  width: calc(100% + 40px);
  height: calc(100% + 40px);
  display: block;
  z-index: 5;
  pointer-events: none;
}
.hero-curtain-center {
  position: relative;
  z-index: 10;
  text-align: center;
  pointer-events: none;
  padding: 0 24px;
  margin-top: 16px;
  will-change: transform, opacity;
}
.hero-author-name {
  font-family: var(--font-serif);
  font-size: clamp(48px, 8.2vw, 108px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.02;
  color: #f4f8f9;
  text-shadow: 0 10px 42px rgba(0, 12, 14, 0.92), 0 2px 12px rgba(0, 0, 0, 0.7);
  margin-bottom: 16px;
}
.hero-author-sub {
  font-size: clamp(13px, 1.8vw, 17px);
  text-transform: uppercase;
  letter-spacing: 0.26em;
  font-weight: 600;
  color: var(--c-ice);
  text-shadow: 0 4px 18px rgba(0, 12, 14, 0.95);
}
.hero-bottom-controls {
  position: absolute;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: auto;
  will-change: opacity, transform;
}
.hero-scroll-btn {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 600;
  color: #ffffff;
  background: rgba(0, 26, 29, 0.65);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(175, 221, 229, 0.28);
  padding: 12px 28px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: all 0.2s ease;
}
.hero-scroll-btn:hover {
  background: rgba(2, 73, 80, 0.88);
  border-color: var(--c-ice);
  transform: translateY(-2px);
}

/* Кнопки в палитре Тёмный Тил */
.btn-dark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--c-teal-dark);
  color: #ffffff;
  padding: 13px 28px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  transition: background-color 0.2s ease, transform 0.2s ease;
}
.btn-dark:hover { background: var(--c-teal-deep); transform: translateY(-1px); }

.btn-outline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #ffffff;
  color: var(--c-teal-deep);
  border: 1px solid var(--border);
  padding: 12px 26px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}
.btn-outline:hover { background: var(--muted); border-color: var(--c-cyan); }

/* ============================================================================
   СЕКЦИЯ ПОРТФОЛИО / ПЬЕСЫ (AvdeevART Gallery + Palette 1)
   ============================================================================ */
.portfolio-section {
  position: relative;
  z-index: 10;
  padding: 56px 0 112px;
  will-change: transform;
}
.portfolio-head {
  text-align: center;
  margin-bottom: 56px;
}
.portfolio-head h2 {
  font-family: var(--font-serif);
  font-size: clamp(44px, 7.4vw, 108px);
  font-weight: 700;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  line-height: 1;
  color: var(--c-teal-deep);
}
.portfolio-head p {
  margin: 22px auto 0;
  max-width: 640px;
  font-size: clamp(16px, 1.8vw, 19px);
  color: var(--muted-foreground);
}

/* Кнопки категорий (AvdeevART rounded-full в цветах Тёмный Тил) */
.category-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  margin-bottom: 68px;
}
.cat-btn {
  padding: 12px 26px;
  border-radius: 999px;
  font-size: 14.5px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: #ffffff;
  color: var(--c-teal-deep);
  transition: all 0.2s ease;
}
.cat-btn:hover {
  background: var(--muted);
  border-color: var(--c-cyan);
}
.cat-btn.active {
  background: var(--c-teal-dark);
  color: #ffffff;
  border-color: var(--c-teal-dark);
}

/* 3-колоночная галерея карточек-книг 4:5 (AvdeevART ArtworkCard) */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 56px 48px;
}
.play-card {
  display: flex;
  flex-direction: column;
  gap: 18px;
  cursor: pointer;
  transition: transform 0.25s ease;
}
.play-card:hover {
  transform: translateY(-5px);
}

/* Обложки пьес 4:5 в нашей палитре (Тёмный Тил, Светлая Бумага, Терракота) */
.book-cover {
  position: relative;
  aspect-ratio: 4 / 5;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 28px 26px;
  transition: box-shadow 0.35s ease, border-color 0.35s ease;
}
.play-card:hover .book-cover {
  box-shadow: 0 22px 48px -16px rgba(0, 49, 53, 0.22);
}
.book-cover--teal {
  background: linear-gradient(155deg, #024950 0%, #002326 100%);
  color: #f4f8f9;
  border-color: rgba(175, 221, 229, 0.18);
}
.book-cover--paper {
  background: linear-gradient(155deg, #ffffff 0%, #edf6f8 100%);
  color: #003135;
  border-color: var(--border);
}
.book-cover--terracotta {
  background: linear-gradient(155deg, #8b3f2d 0%, #4e2117 100%);
  color: #fdf6f4;
  border-color: rgba(255, 212, 203, 0.2);
}
.book-cover-inner {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.play-card:hover .book-cover-inner {
  transform: scale(1.03);
}
.book-cover-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.72;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(15, 164, 175, 0.25);
}
.book-cover--terracotta .book-cover-top {
  border-bottom-color: rgba(255, 255, 255, 0.22);
}
.book-cover-mid {
  margin: auto 0;
  padding: 20px 0;
}
.book-cover-title {
  font-family: var(--font-serif);
  font-size: clamp(24px, 2.3vw, 31px);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
}
.book-cover-quote {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14px;
  line-height: 1.55;
  opacity: 0.78;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-cover-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  opacity: 0.78;
  padding-top: 14px;
  border-top: 1px solid rgba(15, 164, 175, 0.25);
}
.book-cover--terracotta .book-cover-foot {
  border-top-color: rgba(255, 255, 255, 0.22);
}

.play-card-info {
  padding: 0 4px;
}
.play-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
}
.play-card-head h3 {
  font-family: var(--font-serif);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.15;
  color: var(--c-teal-deep);
}
.play-card-year {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--c-terracotta);
  font-weight: 500;
  flex-shrink: 0;
}
.play-card-desc {
  margin-top: 14px;
  font-size: 15.5px;
  line-height: 1.68;
  color: var(--muted-foreground);
  text-indent: 2rem;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ============================================================================
   SPLIT LIGHTBOX MODAL (AvdeevART Gallery.tsx в палитре Тил + Терракота)
   ============================================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.is-open { display: flex; }
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 31, 35, 0.56);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: zoom-out;
}
.modal-nav-btn {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 120;
  width: 52px;
  height: 52px;
  border-radius: 999px;
  background: #ffffff;
  border: 1px solid var(--border);
  color: var(--c-teal-deep);
  box-shadow: 0 10px 25px rgba(0, 49, 53, 0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.18s ease, background-color 0.18s ease;
}
.modal-nav-btn:hover { background: var(--muted); transform: translateY(-50%) scale(1.06); }
.modal-nav-prev { left: 24px; }
.modal-nav-next { right: 24px; }
.modal-close-btn {
  position: fixed;
  top: 22px;
  right: 24px;
  z-index: 120;
  width: 48px;
  height: 48px;
  border-radius: 999px;
  background: #ffffff;
  border: 1px solid var(--border);
  color: var(--c-teal-deep);
  box-shadow: 0 10px 25px rgba(0, 49, 53, 0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.18s ease, background-color 0.18s ease;
}
.modal-close-btn:hover { background: var(--muted); transform: scale(1.06); }

.modal-box {
  position: relative;
  z-index: 110;
  width: 100%;
  max-width: 1140px;
  max-height: 88vh;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 28px 70px rgba(0, 31, 35, 0.28);
  display: grid;
  grid-template-columns: 7fr 5fr;
}
.modal-script-pane {
  background: var(--background);
  border-right: 1px solid var(--border);
  padding: 36px 40px;
  overflow-y: auto;
  max-height: 88vh;
}
.modal-script-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--c-terracotta);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-meta-pane {
  padding: 36px 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow-y: auto;
  max-height: 88vh;
}
.modal-meta-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--c-terracotta);
  font-weight: 500;
}
.modal-title {
  font-family: var(--font-serif);
  font-size: clamp(28px, 3vw, 38px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.025em;
  color: var(--c-teal-deep);
  margin-bottom: 20px;
}
.modal-blurb {
  font-size: 15.5px;
  line-height: 1.68;
  color: var(--muted-foreground);
  text-indent: 2rem;
  margin-bottom: 24px;
}
.modal-lists {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 24px;
}
.modal-list-head {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--c-teal-dark);
  font-weight: 600;
  margin-bottom: 8px;
}
.modal-list-item {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13.5px;
  padding: 6px 0;
  border-bottom: 1px solid var(--muted);
}
.modal-list-item span:last-child {
  color: var(--muted-foreground);
  font-family: var(--font-mono);
  font-size: 12px;
  flex-shrink: 0;
}
.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
}
.modal-foot {
  padding-top: 18px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-foreground);
}

/* Текст пьесы */
.script-body {
  font-family: var(--font-serif);
  font-size: 18px;
  line-height: 1.76;
  color: var(--c-teal-deep);
}
.script-body .p-line { margin: 0 0 13px; }
.script-body .p-speaker {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-teal-dark);
  margin-right: 6px;
}
.script-body .p-cue {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-teal-dark);
  margin: 22px 0 4px;
}
.script-body .p-scene-heading {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--c-terracotta);
  margin: 34px 0 14px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.script-body .p-scene-heading:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.script-body .p-center { text-align: center; font-style: italic; color: var(--muted-foreground); margin: 16px 0; }
.script-body .p-char-item {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--c-teal-deep);
  margin: 0 0 6px;
  padding-left: 12px;
  border-left: 2px solid var(--c-cyan);
}

/* ============================================================================
   ABOUT, CONTACT, READER & FOOTER
   ============================================================================ */
.about-section {
  padding: 132px 0 96px;
}
.about-grid {

/* ============================================================================

   ============================================================================ */
.ta-char, .ta-word {

  will-change: transform, opacity, filter;
}
@keyframes taBlurIn {
  0% { opacity: 0; filter: blur(14px); transform: translate3d(0, 18px, 0) scale(1.04); }
  100% { opacity: 1; filter: blur(0); transform: translate3d(0, 0, 0) scale(1); }
}
.ta-mode-blur .ta-char {
  opacity: 0;
  animation: taBlurIn 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  animation-delay: var(--d, 0ms);
}

<script>
let PLAYS = [];
const playCache = new Map();
let readerFontSize = 18;
try {
  const savedFs = Number(localStorage.getItem('jv_reader_fs'));
  if (savedFs >= 15 && savedFs <= 24) readerFontSize = savedFs;
} catch(e) {}
document.documentElement.style.setProperty('--reader-fs', readerFontSize + 'px');

const AUTHOR_PHOTO = './assets/author.webp';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (i) => String(i + 1).padStart(2, '0');
const bySlug = (s) => PLAYS.find(p => p.slug === s);

const ICONS = {
  arrowDown: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>`,
  bookOpen: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>`,
  download: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>`,
  arrowLeft: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
  externalLink: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>`,
  mail: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>`
};

function formatInlineStageDirs(text) {
  // Выделяем ремарки в скобках курсивом и нормализуем дефисы в типографские тире
  const normalized = esc(text).replace(/\s[–-]\s/g, ' — ');
  return normalized.replace(/\(([^)]{2,140})\)/g, '<span class="p-stage-dir">($1)</span>');
}

function renderPlayParagraphs(playData) {
  const paras = playData.paragraphs || [];
  const speakerRe = /^([А-ЯЁA-Z0-9][А-ЯЁA-Z0-9\s\-]{0,26}?)\.\s+([\s\S]+)$/;
  const sceneHeaderRe = /^(СЦЕНА\b|КРУГ\b|ДЕНЬ\b|НОЧЬ\b|ВОПРОС:|ЭПИЛОГ|КОНЕЦ|ДЕЙСТВУЮЩИЕ ЛИЦА|ЛЮДИ:|ПРИЗРАКИ ПРОШЛОГО|ГОЛОСА ЛЮДЕЙ|ХИМИЧЕСКАЯ ЛАБОРАТОРИЯ|КВАРТИРА|АШРАМ|ВИДЕО|КОМНАТА|ШКОЛЬНЫЙ|УЛИЦА|ОГЭ ПО ЛИТРЕ\.|CHIZHUK@|CHIZHIK-PYZHIK|FACEBOOK\.COM)/i;
  const titleNorm = (playData.title || '').trim().toLowerCase();

  return paras.map((item, idx) => {
    const raw = (item.t || '').trim();
    if (!raw) return '';
    if (idx < 7) {
      const low = raw.toLowerCase();
      if (low === titleNorm || low.startsWith('пьеса юлии вороновой') || low.startsWith('автор:') || low.startsWith('автор –') || low === 'юлии вороновой' || low === '6+' || low === '12+' || low.includes('krupianko@mail.ru') || low.includes('89099654867')) return '';
    }
    const k = item.k || 'normal';
    if (k === 'center') return `<p class="p-center">${formatInlineStageDirs(raw)}</p>`;
    const spMatch = raw.match(speakerRe);
    if (spMatch && !sceneHeaderRe.test(raw)) {
      return `<p class="p-line"><span class="p-speaker">${esc(spMatch[1])}.</span> ${formatInlineStageDirs(spMatch[2])}</p>`;
    }
    if (k === 'scene') {
      if (raw.startsWith('- ')) return `<p class="p-char-item">${formatInlineStageDirs(raw)}</p>`;
      if (sceneHeaderRe.test(raw) || (playData.slug === 'dnevnik' && raw === 'АЛЕНА')) return `<h3 class="p-scene-heading">${esc(raw)}</h3>`;
      return `<div class="p-cue">${esc(raw)}</div>`;
    }
    if (raw.startsWith('- ') && idx < 25) return `<p class="p-char-item">${formatInlineStageDirs(raw)}</p>`;
    return `<p class="p-line">${formatInlineStageDirs(raw)}</p>`;
  }).join('');
}

async function loadPlayText(slug) {
  if (playCache.has(slug)) return playCache.get(slug);
  const res = await fetch(`./data/plays/${encodeURIComponent(slug)}.json`);
  if (!res.ok) throw new Error('Не удалось загрузить текст пьесы');
  const data = await res.json();
  playCache.set(slug, data);
  return data;
}

let selectedCategory = 'Все';
let activeModalList = [];
let activeModalIndex = null;

function getFilteredPlays() {
  if (selectedCategory === 'Поставленные') return PLAYS.filter(p => p.productions && p.productions.length > 0);
  if (selectedCategory === 'Для детей и подростков') return PLAYS.filter(p => Boolean(p.age));
  if (selectedCategory === 'Конкурсные') return PLAYS.filter(p => p.contests && p.contests.length > 0);
  return PLAYS;
}

const COVER_STYLES = ['book-cover--teal', 'book-cover--paper', 'book-cover--terracotta', 'book-cover--paper', 'book-cover--teal', 'book-cover--paper', 'book-cover--terracotta'];

function renderGalleryCards(list) {
  return list.map((p, idx) => {
    const realIdx = PLAYS.indexOf(p);
    const coverStyle = COVER_STYLES[realIdx % COVER_STYLES.length];
    const prodCount = (p.productions || []).length;
    const footerRight = prodCount > 0
      ? `${prodCount} ${prodCount === 1 ? 'постановка' : (prodCount < 5 ? 'постановки' : 'постановок')}`
      : (p.contests && p.contests.length ? p.contests[0][0] : 'Рукопись');
    return `
    <article class="play-card" data-open-play="${idx}">
      <div class="book-cover ${coverStyle}">
        <div class="book-cover-inner">
          <div class="book-cover-top">
            <span>№ ${pad(realIdx)}</span>
            <span>${esc(p.label)}${p.age ? ' · ' + esc(p.age) : ''}</span>
          </div>
          <div class="book-cover-mid">
            <div class="book-cover-title">${esc(p.title)}</div>
            <div class="book-cover-quote">«${esc(p.blurb)}»</div>
          </div>
          <div class="book-cover-foot">
            <span>~${p.readingMins} мин чтения</span>
            <span>${esc(footerRight)}</span>
          </div>
        </div>
      </div>
      <div class="play-card-info">
        <div class="play-card-head">
          <h3>${esc(p.title)}</h3>
          <span class="play-card-year">${p.year ? esc(p.year) : 'Пьеса'}</span>
        </div>
        <p class="play-card-desc">${esc(p.blurb)}</p>
      </div>
    </article>`;
  }).join('');
}

async function openPlayModal(index) {
  activeModalList = getFilteredPlays();
  if (!activeModalList.length) return;
  activeModalIndex = ((index % activeModalList.length) + activeModalList.length) % activeModalList.length;
  const p = activeModalList[activeModalIndex];
  const modal = document.getElementById('playModal');
  const box = document.getElementById('modalBox');
  if (!modal || !box || !p) return;

  const listBlock = (title, items) => items && items.length ? `
    <div>
      <div class="modal-list-head">${title}</div>
      ${items.map(x => `<div class="modal-list-item"><span>${esc(x[0])}</span><span>${esc(x[1] || '')}</span></div>`).join('')}
    </div>` : '';

  const isVerse = (p.label || '').toLowerCase().includes('стих');

  box.innerHTML = `
    <div class="modal-script-pane">
      <div class="modal-script-label">
        <span>Полный текст пьесы · ~${p.readingMins} мин</span>
        <div class="reader-size-controls">
          <button type="button" class="size-btn" data-fs-delta="-1" title="Уменьшить шрифт">A−</button>
          <button type="button" class="size-btn" data-fs-delta="1" title="Увеличить шрифт">A+</button>
        </div>
      </div>
      <div class="script-body ${isVerse ? 'is-verse' : ''}" id="modalScriptBody">
        <div class="script-loading">Загрузка текста пьесы...</div>
      </div>
    </div>
    <div class="modal-meta-pane">
      <div>
        <div class="modal-meta-top">
          <span>${esc(p.label)}${p.age ? ' · ' + esc(p.age) : ''}</span>
          <span>${p.year ? esc(p.year) + ' год' : 'Драматургия'}</span>
        </div>
        <h2 class="modal-title">${esc(p.title)}</h2>
        <p class="modal-blurb">${esc(p.blurb)}</p>
        <div class="modal-actions">
          <a class="btn-dark" href="#/read/${p.slug}">${ICONS.bookOpen} Во весь экран</a>
          <a class="btn-outline" href="${p.docxUrl}" download="${esc(p.fileName)}">${ICONS.download} Скачать DOCX</a>
        </div>
        <div class="modal-lists">
          ${listBlock('Постановки', p.productions)}
          ${listBlock('Конкурсы и фестивали', p.contests)}
          ${listBlock('Читки и лаборатории', p.labs)}
          ${listBlock('Публикации', p.publications)}
        </div>
      </div>
      <div class="modal-foot">
        <span>Пьеса ${activeModalIndex + 1} из ${activeModalList.length}</span>
        <span>Юлия Воронова</span>
      </div>
    </div>`;

  modal.classList.add('is-open');
  document.body.style.overflow = 'hidden';

  try {
    const full = await loadPlayText(p.slug);
    const bodyEl = document.getElementById('modalScriptBody');
    if (bodyEl && activeModalList[activeModalIndex]?.slug === p.slug) {
      bodyEl.innerHTML = renderPlayParagraphs(full);
    }
  } catch (err) {

  }
}

let activeDrapeCleanup = null;

function initDrapeBackground() {
  if (activeDrapeCleanup) {
    activeDrapeCleanup();
    activeDrapeCleanup = null;
  }

  const root = document.getElementById('drapeStage');
  const canvas = document.getElementById('drapeCanvas');
  const backdrop = document.getElementById('heroBackdrop');
  const spotlight = document.getElementById('heroSpotlight');
  const centerText = document.getElementById('heroCenterText');
  const bottomControls = document.getElementById('heroBottomControls');
  const repertoire = document.getElementById('portfolio');
  if (!root || !canvas) return;

  const gl = canvas.getContext('webgl', { antialias: true, alpha: true, premultipliedAlpha: false });
  if (!gl) return;

  const STEP = 1 / 60;
  const GRAVITY = 960;
  const DAMPING = 0.965;
  const ITERATIONS = 4;
  const WING_COLS = 30;
  const MIN_CELL = 16;
  const PLEAT_PERIOD = 3.8;
  const BEND = 0.4;
  const FOCAL = 1400;
  const wind = 0.75;
  const pleat = 48;
  const BLEED_Y = 1.24;

  function createLinks(cols, rows, restX, restY) {
    const links = [], lengths = [], stiffness = [];
    const link = (a, b, length, stiff) => {
      links.push(a, b); lengths.push(length); stiffness.push(stiff);
    };
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const a = j * cols + i;
        if (i + 1 < cols && j > 0) link(a, a + 1, restX, 1);
        if (j + 1 < rows) link(a, a + cols, restY, 1);
        if (i + 2 < cols && j > 0) link(a, a + 2, restX * 2, BEND);
        if (j + 2 < rows) link(a, a + cols * 2, restY * 2, BEND);
      }
    }
    return { links, lengths, stiffness };
  }

  // Вычисляет целевые X-координаты для точки (i, j) левой (side=-1) или правой (side=+1) кулисы
  function computeTargetX(side, i, j, cols, rows, width, openProgress) {
    const u = i / (cols - 1); // 0 = внешний край у стены, 1 = внутренний край у центра сцены
    const v = j / (rows - 1); // 0 = верхний карниз, 1 = низ занавеса

    // Эффект театрального подхвата (кулиса раскрывается широкой благородной дугой к низу и середине)
    const archCurve = Math.sin(Math.pow(v, 0.78) * Math.PI * 0.88) * 0.22;
    const localOpen = Math.min(1.22, openProgress * (1.0 + archCurve * (0.45 + 0.55 * u)));

    // В закрытом состоянии (localOpen = 0) кулисы перекрывают друг друга в центре на 2.5%, чтобы не было щели
    const outerX = side < 0 ? -width * 0.16 : width * 1.16;
    const closedInnerX = side < 0 ? width * 0.522 : width * 0.478;

    // В открытом состоянии кулисы собираются в плотные складки и уходят за боковые края экрана
    const openOuterX = side < 0 ? -width * 0.36 : width * 1.36;
    const openInnerX = side < 0 ? -width * 0.04 : width * 1.04;

    const curOuter = outerX + (openOuterX - outerX) * localOpen;
    const curInner = closedInnerX + (openInnerX - closedInnerX) * localOpen;

    return curOuter + (curInner - curOuter) * u;
  }

  function createWing(side, width, height) {
    const cols = WING_COLS;
    const spanClosed = width * 0.68;
    const restX = spanClosed / (cols - 1);
    const restY = Math.max(MIN_CELL, (height * BLEED_Y) / 38);
    const rows = Math.ceil((height * BLEED_Y) / restY) + 1;
    const top = -restY * 1.25;
    const count = cols * rows;

    const pos = new Float32Array(count * 3);
    const pinned = new Uint8Array(count);
    const pins = new Float32Array(cols * 3);
    const folds = new Float32Array(cols);

    let phase = side < 0 ? 0.4 : 1.9;
    for (let i = 0; i < cols; i++) {
      phase += ((Math.PI * 2) / PLEAT_PERIOD) * (1 + 0.22 * Math.sin(i * 0.85));
      // У внутреннего края кулисы складки глубже и выразительнее
      const edgeAmp = 0.78 + 0.34 * (i / (cols - 1));
      folds[i] = pleat * Math.sin(phase) * edgeAmp;
    }

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const k = (j * cols + i) * 3;
        const x = computeTargetX(side, i, j, cols, rows, width, 0);
        const y = top + j * restY;
        const z = folds[i];
        pos[k] = x;
        pos[k + 1] = y;
        pos[k + 2] = z;
        if (j === 0) {
          pinned[i] = 1;
          pins[i * 3] = x;
          pins[i * 3 + 1] = y;
          pins[i * 3 + 2] = z;
        }
      }
    }

    const { links, lengths, stiffness } = createLinks(cols, rows, restX, restY);
    const indices = new Uint16Array((cols - 1) * (rows - 1) * 6);
    let o = 0;
    for (let j = 0; j < rows - 1; j++) {
      for (let i = 0; i < cols - 1; i++) {
        const a = j * cols + i;
        indices.set([a, a + 1, a + cols, a + 1, a + cols + 1, a + cols], o);
        o += 6;
      }
    }

    return {
      side, cols, rows, restX, restY, top, folds,
      pos, prev: pos.slice(), pinned, pins,
      links: new Uint32Array(links),
      lengths: new Float32Array(lengths),
      stiffness: new Float32Array(stiffness),
      indices,
      vertices: new Float32Array(count * 6),
      lastOpen: 0
    };
  }

  function applyOpeningToWing(wing, width, targetOpen) {
    const { side, cols, rows, pos, prev, pins, folds, top, restY } = wing;
    const deltaOpen = targetOpen - wing.lastOpen;
    wing.lastOpen = targetOpen;

    // При раздвижении складки становятся глубже за счёт сборки ткани к кулисам
    const gatherBoost = 1.0 + targetOpen * 0.55;

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const idx = j * cols + i;
        const k = idx * 3;
        const targetX = computeTargetX(side, i, j, cols, rows, width, targetOpen);

        if (j === 0) {
          const z = folds[i] * gatherBoost;
          pins[i * 3] = targetX;
          pins[i * 3 + 1] = top;
          pins[i * 3 + 2] = z;
          pos[k] = targetX;
          pos[k + 1] = top;
          pos[k + 2] = z;
          prev[k] = targetX;
          prev[k + 1] = top;
          prev[k + 2] = z;
        } else {
          // Плавное притяжение полотна к траектории кулисы с сохранением инерции ткани
          const pull = Math.abs(deltaOpen) > 0.0001 ? 0.34 : 0.14;
          const dx = (targetX - pos[k]) * pull;
          pos[k] += dx;
          prev[k] += dx * 0.72;

          // Поддерживаем рельеф вертикальных бархатных складок при сборке
          const targetZ = folds[i] * gatherBoost;
          pos[k + 2] += (targetZ - pos[k + 2]) * 0.08;
        }
      }
    }
  }

  const accel = [0, 0, 0];
  function integrateWing(wing, time, currentOpen) {
    const { pos, prev, pinned, side } = wing;
    const dt2 = STEP * STEP;
    let motion = 0;
    const windAmp = wind * (1.0 - currentOpen * 0.35);

    for (let n = 0; n < pinned.length; n++) {
      if (pinned[n]) continue;
      const k = n * 3;
      const x = pos[k], y = pos[k + 1], z = pos[k + 2];

      const gust = Math.sin(x * 0.006 + time * 0.9 + side) * 0.6 + Math.sin(x * 0.013 - time * 1.6 + y * 0.004) * 0.4;
      const swell = 0.6 + 0.4 * Math.sin(time * 0.35);
      const ax = Math.sin(time * 0.5 + y * 0.003) * windAmp * 18;
      const ay = GRAVITY;
      const az = gust * swell * windAmp * 210 * (y / 600);

      const vx = (x - prev[k]) * DAMPING;
      const vy = (y - prev[k + 1]) * DAMPING;
      const vz = (z - prev[k + 2]) * DAMPING;
      prev[k] = x; prev[k + 1] = y; prev[k + 2] = z;
      pos[k] = x + vx + ax * dt2;
      pos[k + 1] = y + vy + ay * dt2;
      pos[k + 2] = z + vz + az * dt2;
      motion += Math.abs(vx) + Math.abs(vy) + Math.abs(vz);
    }
    return motion / pinned.length;
  }

  function relaxWing(wing) {
    const { pos, pinned, links, lengths, stiffness, pins, cols } = wing;
    for (let it = 0; it < ITERATIONS; it++) {
      for (let l = 0; l < lengths.length; l++) {
        const a = links[l * 2], b = links[l * 2 + 1];
        const ka = a * 3, kb = b * 3;
        const dx = pos[kb] - pos[ka], dy = pos[kb + 1] - pos[ka + 1], dz = pos[kb + 2] - pos[ka + 2];
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
        const diff = (d - lengths[l]) / d;
        if (stiffness[l] < 1 && diff > 0) continue;
        const wa = 1 - pinned[a], wb = 1 - pinned[b];
        const s = (diff * stiffness[l]) / (wa + wb);
        pos[ka] += dx * s * wa; pos[ka + 1] += dy * s * wa; pos[ka + 2] += dz * s * wa;
        pos[kb] -= dx * s * wb; pos[kb + 1] -= dy * s * wb; pos[kb + 2] -= dz * s * wb;
      }
      for (let i = 0; i < cols; i++) {
        pos.set(pins.subarray(i * 3, i * 3 + 3), i * 3);
      }
    }
  }

  function writeVertices(wing) {
    const { cols, rows, pos, vertices: out } = wing;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const n = j * cols + i;
        const l = (j * cols + Math.max(i - 1, 0)) * 3;
        const r = (j * cols + Math.min(i + 1, cols - 1)) * 3;
        const u = (Math.max(j - 1, 0) * cols + i) * 3;
        const d = (Math.min(j + 1, rows - 1) * cols + i) * 3;
        const ax = pos[r] - pos[l], ay = pos[r + 1] - pos[l + 1], az = pos[r + 2] - pos[l + 2];
        const bx = pos[d] - pos[u], by = pos[d + 1] - pos[u + 1], bz = pos[d + 2] - pos[u + 2];
        let nx = by * az - bz * ay, ny = bz * ax - bx * az, nz = bx * ay - by * ax;
        const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
        nx /= len; ny /= len; nz /= len;
        const o = n * 6;
        out[o] = pos[n * 3]; out[o + 1] = pos[n * 3 + 1]; out[o + 2] = pos[n * 3 + 2];
        out[o + 3] = nx; out[o + 4] = ny; out[o + 5] = nz;
      }
    }
  }

  const VERTEX = `
attribute vec3 aPos;
attribute vec3 aNormal;
uniform vec2 uSize;
uniform float uFocal;
varying vec3 vNormal;
void main() {
  float s = uFocal / (uFocal + aPos.z);
  vec2 p = uSize * 0.5 + (aPos.xy - uSize * 0.5) * s;
  gl_Position = vec4(p.x / uSize.x * 2.0 - 1.0, 1.0 - p.y / uSize.y * 2.0, clamp(aPos.z / 4000.0, -1.0, 1.0), 1.0);
  vNormal = aNormal;
}`;

  const FRAGMENT = `
precision mediump float;
uniform vec3 uLit;
uniform vec3 uShade;
varying vec3 vNormal;

float velvetGrain(vec2 p) {
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
  vec3 n = normalize(vNormal);
  if (n.z > 0.0) n = -n;
  
  vec3 light = normalize(vec3(-0.42, -0.65, -0.62));
  vec3 bounceLight = normalize(vec3(0.5, 0.6, -0.3));
  
  float NdotL = dot(n, light);
  float wrap = max(NdotL * 0.65 + 0.35, 0.0);
  float bounce = max(dot(n, bounceLight) * 0.5 + 0.5, 0.0);
  
  vec3 view = vec3(0.0, 0.0, -1.0);
  float NdotV = clamp(abs(dot(n, view)), 0.0, 1.0);
  float rim = pow(1.0 - NdotV, 2.4);
  float sheen = rim * (max(dot(-light, view), 0.0) * 0.45 + wrap * 0.7);
  
  vec3 h = normalize(light + view);
  float softSpec = pow(max(dot(n, h), 0.0), 5.0) * 0.14;
  
  vec3 deepCrease = uShade * 0.65;
  vec3 body = mix(deepCrease, uLit, wrap * 0.82);
  vec3 rimTint = vec3(0.24, 0.64, 0.68);
  vec3 warmGlow = vec3(0.16, 0.07, 0.04) * (bounce * 0.28);
  
  vec3 color = body + rimTint * (sheen * 0.65 + rim * 0.4) + softSpec * uLit + warmGlow;
  
  float grain = (velvetGrain(gl_FragCoord.xy) - 0.5) * 0.032;
  color += grain * (0.75 + 0.25 * rim);
  
  gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
}`;

  function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VERTEX));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const vertexBuffer = gl.createBuffer();
  const indexBuffer = gl.createBuffer();
  const aPos = gl.getAttribLocation(prog, "aPos");
  const aNormal = gl.getAttribLocation(prog, "aNormal");
  gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.enableVertexAttribArray(aPos);
  gl.enableVertexAttribArray(aNormal);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 24, 0);
  gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 24, 12);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);

  const uSize = gl.getUniformLocation(prog, "uSize");
  const uFocal = gl.getUniformLocation(prog, "uFocal");
  const uLit = gl.getUniformLocation(prog, "uLit");
  const uShade = gl.getUniformLocation(prog, "uShade");

  const darkTealShade = [0.0, 0.12, 0.14];
  const darkTealLit   = [0.05, 0.45, 0.48];
  gl.uniform3fv(uShade, darkTealShade);
  gl.uniform3fv(uLit, darkTealLit);

  let width = 0, height = 0;
  let leftWing = null, rightWing = null;
  let simTime = 0;
  let targetOpen = 0;
  let smoothOpen = 0;

  function computeScrollOpen() {
    const scrollY = window.scrollY || window.pageYOffset || 0;
    const openDist = Math.max(380, (window.innerHeight || 800) * 0.78);
    return Math.max(0, Math.min(1, scrollY / openDist));
  }

  function updateStageDOM(openVal) {
    // 1. Заголовок и луч софита плавно растворяются и приподнимаются по мере раскрытия кулис
    const textFade = Math.max(0, 1 - openVal * 2.1);
    if (centerText) {
      centerText.style.opacity = textFade.toFixed(3);
      centerText.style.transform = `translate3d(0, ${(-openVal * 48).toFixed(1)}px, 0) scale(${(1 - openVal * 0.06).toFixed(3)})`;
    }
    if (spotlight) {
      spotlight.style.opacity = Math.max(0, 1 - openVal * 1.45).toFixed(3);
    }
    if (bottomControls) {
      const btnFade = Math.max(0, 1 - openVal * 2.6);
      bottomControls.style.opacity = btnFade.toFixed(3);
      bottomControls.style.pointerEvents = btnFade > 0.15 ? 'auto' : 'none';
      bottomControls.style.transform = `translate3d(-50%, ${(openVal * 24).toFixed(1)}px, 0)`;
    }
    // 2. Тёмная глубина сцены позади кулис просветляется, открывая светлую страницу под занавесом
    if (backdrop) {
      const bdAlpha = Math.max(0, 1 - Math.pow(openVal, 0.72) * 1.15);
      backdrop.style.opacity = bdAlpha.toFixed(3);
    }
    // 3. Основной контент плавно выезжает вперёд и вверх из-под раздвигающихся кулис
    if (repertoire) {
      const emerge = Math.min(1, openVal * 1.15);
      const liftY = (1 - emerge) * 72;
      const scale = 0.965 + emerge * 0.035;
      repertoire.style.transform = `translate3d(0, ${liftY.toFixed(1)}px, 0) scale(${scale.toFixed(4)})`;
      repertoire.style.transformOrigin = '50% 0%';
    }
    // 4. Когда кулисы полностью раздвинуты за края экрана, скрываем слой, чтобы не тратить ресурсы
    if (root) {
      root.style.visibility = openVal >= 0.995 ? 'hidden' : 'visible';
    }
  }

  function drawWing(wing) {
    writeVertices(wing);
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, wing.vertices, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, wing.indices, gl.STATIC_DRAW);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 24, 0);
    gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 24, 12);
    gl.drawElements(gl.TRIANGLES, wing.indices.length, gl.UNSIGNED_SHORT, 0);
  }

  function draw() {
    if (!leftWing || !rightWing) return;
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (smoothOpen < 0.995) {
      drawWing(leftWing);
      drawWing(rightWing);
    }
  }

  function build() {
    const rect = root.getBoundingClientRect();
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uSize, width, height);
    gl.uniform1f(uFocal, FOCAL);

    leftWing = createWing(-1, width, height);
    rightWing = createWing(1, width, height);

    targetOpen = computeScrollOpen();
    smoothOpen = targetOpen;
    applyOpeningToWing(leftWing, width, smoothOpen);
    applyOpeningToWing(rightWing, width, smoothOpen);

    for (let i = 0; i < 90; i++) {
      simTime += STEP;
      integrateWing(leftWing, simTime, smoothOpen);
      relaxWing(leftWing);
      integrateWing(rightWing, simTime, smoothOpen);
      relaxWing(rightWing);
    }
    updateStageDOM(smoothOpen);
    draw();
  }

  let raf = 0, last = 0, carry = 0;
  function frame(now) {
    raf = 0;
    if (!leftWing || !rightWing) return;

    targetOpen = computeScrollOpen();
    smoothOpen += (targetOpen - smoothOpen) * 0.18;
    if (Math.abs(targetOpen - smoothOpen) < 0.0005) smoothOpen = targetOpen;

    updateStageDOM(smoothOpen);

    if (smoothOpen >= 0.995 && targetOpen >= 0.995) {
      draw();
      return; // Останавливаем цикл рендера, когда кулисы полностью раздвинуты за экран
    }

    carry += last ? Math.min((now - last) / 1000, 0.1) : STEP;
    last = now;
    let steps = 0;
    while (carry >= STEP && steps < 3) {
      simTime += STEP;
      applyOpeningToWing(leftWing, width, smoothOpen);
      applyOpeningToWing(rightWing, width, smoothOpen);
      integrateWing(leftWing, simTime, smoothOpen);
      relaxWing(leftWing);
      integrateWing(rightWing, simTime, smoothOpen);
      relaxWing(rightWing);
      carry -= STEP;
      steps++;
    }
    carry = Math.min(carry, STEP);
    draw();
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (!raf) {
      last = 0;
      raf = requestAnimationFrame(frame);
    }
  }

  gl.clearColor(0, 0, 0, 0);
  build();
  start();

  const onResize = () => { build(); start(); };
  const onScroll = () => {
    targetOpen = computeScrollOpen();
    start();
  };

  window.addEventListener('resize', onResize);
  window.addEventListener('scroll', onScroll, { passive: true });

  activeDrapeCleanup = () => {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', onResize);
    window.removeEventListener('scroll', onScroll);
    gl.deleteBuffer(vertexBuffer);
    gl.deleteBuffer(indexBuffer);
    gl.deleteProgram(prog);
  };
}

function runBlurFadeReveal(el, baseDelay = 0) {
  if (!el) return;
  if (!el.dataset.rawText) el.dataset.rawText = el.textContent.trim();
  const text = el.dataset.rawText;
  const words = text.split(' ');
  let charIdx = 0;

  el.classList.remove('ta-mode-blur');
  el.innerHTML = words.map((word) => {
    const letters = Array.from(word).map((ch) => {
      const delay = baseDelay + charIdx * 36;
      charIdx++;
      return `<span class="ta-char" style="--d:${delay}ms">${esc(ch)}</span>`;
    }).join('');
    charIdx++;
    return `<span class="ta-word">${letters}</span>`;
  }).join(' ');
  void el.offsetWidth;
  el.classList.add('ta-mode-blur');
}

function initBlurFadeReveals() {
  const heroEl = document.querySelector('[data-ta-target="hero"]');
  const subEl = document.querySelector('[data-ta-target="sub"]');
  if (heroEl) runBlurFadeReveal(heroEl, 80);
  if (subEl) runBlurFadeReveal(subEl, 380);

  const secEls = document.querySelectorAll('[data-ta-target="section"]');
  if (secEls.length && typeof IntersectionObserver !== 'undefined') {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          runBlurFadeReveal(entry.target, 0);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.35 });
    secEls.forEach(el => io.observe(el));
  }
}

function updateNavbarState() {
  const nav = document.getElementById('navbar');
  if (!nav) return;
  const h = location.hash || '#/';
  const isHome = h === '#/' || h === '';
  const threshold = Math.max(260, (window.innerHeight || 800) * 0.55);
  if (!isHome || (window.scrollY || 0) > threshold) nav.classList.add('is-solid');
  else nav.classList.remove('is-solid');
}

async function render() {
  closePlayModal();
  const h = location.hash || '#/';
  const app = $('#app');

  if (h === '#/' || h === '') {
    app.innerHTML = homeView();
    document.title = 'Юлия Воронова — Драматургия и тексты пьес';
    initDrapeBackground();
  } else {
    if (activeDrapeCleanup) {
      activeDrapeCleanup();
      activeDrapeCleanup = null;
    }
    if (h === '#/about') {
      app.innerHTML = aboutView();
      document.title = 'Обо мне — Юлия Воронова';
    } else if (h === '#/contact') {
      app.innerHTML = contactView();
      document.title = 'Контакты — Юлия Воронова';
      const form = document.getElementById('writerContactForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = (document.getElementById('cfName').value || '').trim();
          const subj = (document.getElementById('cfSubject').value || '').trim();
          const msg = (document.getElementById('cfMsg').value || '').trim();
          const body = `Имя / Театр: ${name}\n\n${msg}`;
          window.location.href = `mailto:krupianko@mail.ru?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
        });
      }
    } else if (h.startsWith('#/read/')) {
      const slug = h.slice(7);
      const p = bySlug(slug);
      app.innerHTML = p ? readView(p) : `<div class="container" style="padding:140px 24px;"><h1>Текст не найден</h1></div>`;
      document.title = p ? `Чтение: ${p.title}` : 'Не найдено';
      if (p) {
        try {
          const full = await loadPlayText(p.slug);
          const el = document.getElementById('fullReaderBody');
          if (el) el.innerHTML = renderPlayParagraphs(full);
        } catch (err) {
          const el = document.getElementById('fullReaderBody');
          if (el) el.innerHTML = `<div class="script-loading">Не удалось загрузить текст пьесы.</div>`;
        }
      }
    }
  }

  document.querySelectorAll('[data-nav]').forEach(a => {
    const target = a.getAttribute('data-nav');
    const isHomeTab = target === '#/' && (h === '#/' || h === '' || h.startsWith('#/read/'));
    if (target === h || isHomeTab) a.classList.add('active');
    else a.classList.remove('active');
  });

  const drawer = document.getElementById('mobileDrawer');
  if (drawer) drawer.classList.remove('is-open');
  window.scrollTo(0, 0);
  updateNavbarState();
  initBlurFadeReveals();
}

document.addEventListener('click', (e) => {
  const fsBtn = e.target.closest('[data-fs-delta]');
  if (fsBtn) {
    readerFontSize = Math.max(15, Math.min(24, readerFontSize + Number(fsBtn.getAttribute('data-fs-delta'))));
    document.documentElement.style.setProperty('--reader-fs', readerFontSize + 'px');
    try { localStorage.setItem('jv_reader_fs', String(readerFontSize)); } catch(err) {}
    return;
  }

  const sc = e.target.closest('[data-scroll-repertoire]');
  if (sc) {
    e.preventDefault();
    const openDist = Math.max(420, Math.round((window.innerHeight || 800) * 0.82));
    window.scrollTo({ top: openDist, behavior: 'smooth' });
    return;
  }

  const cat = e.target.closest('[data-cat]');
  if (cat) {
    selectedCategory = cat.getAttribute('data-cat');
    document.querySelectorAll('[data-cat]').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-cat') === selectedCategory);
    });
    const grid = document.getElementById('galleryGrid');
    if (grid) grid.innerHTML = renderGalleryCards(getFilteredPlays());
    return;
  }

  const openPlay = e.target.closest('[data-open-play]');
  if (openPlay) {
    openPlayModal(Number(openPlay.getAttribute('data-open-play')));
    return;
  }

  if (e.target.closest('#modalClose') || e.target.closest('#modalBackdrop')) {
    closePlayModal();
    return;
  }
  if (e.target.closest('#modalPrev') && activeModalIndex !== null) {
    openPlayModal(activeModalIndex - 1);
    return;
  }
  if (e.target.closest('#modalNext') && activeModalIndex !== null) {
    openPlayModal(activeModalIndex + 1);
    return;
  }
  if (e.target.closest('#mobileMenuBtn')) {
    const d = document.getElementById('mobileDrawer');
    if (d) d.classList.toggle('is-open');
  }
});

window.addEventListener('keydown', (e) => {
  if (activeModalIndex === null) return;
  if (e.key === 'Escape') closePlayModal();
  else if (e.key === 'ArrowRight') openPlayModal(activeModalIndex + 1);
  else if (e.key === 'ArrowLeft') openPlayModal(activeModalIndex - 1);
});

window.addEventListener('scroll', updateNavbarState, { passive: true });
window.addEventListener('hashchange', render);

async function bootstrap() {
  try {
    const res = await fetch('./data/catalog.json');
    PLAYS = await res.json();
  } catch (err) {
    console.error('Failed to load catalog.json:', err);
    PLAYS = [];
  }
  render();
}

if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', bootstrap);
else bootstrap();
</script>
</body>
</html>
